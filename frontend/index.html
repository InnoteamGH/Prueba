<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dento Check — Software dental</title>
    <meta name="description" content="Software dental para clínicas del Perú: agenda, historia clínica, odontograma, cobros y un asistente con IA en WhatsApp." />
    <meta name="theme-color" content="#087E8B" />

    <!--
      Las fuentes se piden AQUÍ y no con un @import dentro del <style> que inyecta
      React al montarse. Con el @import el navegador no se enteraba de que existían
      hasta ejecutar el JavaScript, así que la pantalla se dibujaba con la tipografía
      del sistema y los títulos daban un salto al llegar la buena.
      El preconnect abre la conexión con Google Fonts mientras aún se descarga el JS.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
